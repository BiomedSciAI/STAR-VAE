[pytest]
# ── Test discovery ───────────────────────────────────────────────────────────
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Default suite: self-contained, CPU-only tests.
# Opt in to resource-heavy tests with:
#   pytest -m slow
#   pytest -m requires_ckpt
#   pytest -m external_artifact
#   pytest -m "slow or requires_ckpt or external_artifact"
addopts = -v --tb=short -p no:warnings -m "not slow and not requires_ckpt and not external_artifact"

# ── Markers ──────────────────────────────────────────────────────────────────
markers =
    external_artifact: requires ignored manuscript or paper-result artifacts
    requires_ckpt: requires a real model checkpoint file configured by a CKPT_* env var
    slow: takes more than a few seconds or runs a Lightning Trainer
filterwarnings =
    ignore::DeprecationWarning
    ignore::UserWarning
    ignore::FutureWarning
