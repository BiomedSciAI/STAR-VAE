# ============================================================
# configs/model_vae_4lde_stratified.yaml
# Experiment 16/17: Fine-tune STAR-VAE CVAE on Tartarus 4LDE docking scores
# with stratified training data and percentile-rank label normalization.
#
# Usage:
#   python -m bmfm_sm_gen.launch.run_train fit \
#     --config configs/model_vae_4lde_stratified.yaml
#
# Training data is generated by:
#   python bmfm_sm_gen/scripts/exp16_prep_stratified_tartarus.py \
#     --target 4lde --output-dir data/tartarus/stratified
# ============================================================

model:
  class_path: bmfm_sm_gen.trainers.lm_cvae.CVAELightningModule
  init_args:
    model_class: bmfm_sm_gen.models.cvae.ConditionalTransformerVAE
    model_params:
      d_model: 512
      nhead: 8
      num_encoder_layers: 12
      num_decoder_layers: 12
      dim_feedforward: 2048
      latent_dim: 256
      dropout: 0.1
      max_len: 71
      num_tasks: 1
    pretrained_path: ${oc.env:CKPT_4LDE}
    lora: both
    lora_r: 8
    lora_alpha: 32
    lora_dropout: 0.05
    use_conditional_prior: True
    modulation_scheme: film
    tokenizer: ${data.init_args.tokenizer}
    vocab_file: ${data.init_args.vocab_file}
    learning_rate: 0.0001
    val_csv: ${data.init_args.val_csv}
    label_norm: percentile
    num_bins: 10
    samples_per_bin: 50

data:
  class_path: bmfm_sm_gen.data.dm_mol.MolecularDataModule
  init_args:
    train_mode: mem
    data_dir: ""
    train_csv: ${oc.env:TARTARUS_4LDE_TRAIN_CSV,${oc.env:DATA_DIR,data}/tartarus/stratified/4lde_stratified_6k_train.csv}
    val_csv:   ${oc.env:TARTARUS_4LDE_VAL_CSV,${oc.env:DATA_DIR,data}/tartarus/stratified/4lde_stratified_6k_val.csv}
    tokenizer: bmfm_sm_gen.data.base_tokenizer.SELFIESTokenizer
    vocab_file: ${oc.env:VOCAB_FILE}
    max_len: 71
    batch_size: 32
    dataset_args:
      modality: selfies
      padding: max_length
      label_columns:
        - y_normalized_percentile

trainer:
  max_epochs: 30
  devices: 1
  num_nodes: 1
  accelerator: auto
  default_root_dir: ${oc.env:OUTPUT_DIR,outputs}/cvae_4lde_stratified
  logger:
    class_path: pytorch_lightning.loggers.TensorBoardLogger
    init_args:
      save_dir: ${trainer.default_root_dir}
  log_every_n_steps: 10
  val_check_interval: 1.0
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        monitor: val_loss
        dirpath: ${trainer.default_root_dir}/checkpoints
        filename: vae-epoch{epoch:02d}-step{step}-val_loss{val_loss:.2f}
        save_top_k: 3
        mode: min
        save_last: true
        save_on_train_epoch_end: false
    - class_path: pytorch_lightning.callbacks.EarlyStopping
      init_args:
        monitor: val_loss
        patience: 10
        mode: min
