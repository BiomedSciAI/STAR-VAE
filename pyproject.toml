[build-system]
requires = ["setuptools>=77,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "star-vae"
description = "STAR-VAE: A Scalable Latent-Variable Transformer for Controllable Molecular Generation"
authors = [
    {name = "Bum Chul Kwon", email = "bumchul.kwon@us.ibm.com"},
    {name = "Ben Shapira"},
    {name = "Moshiko Raboh"},
    {name = "Shreyans Sethi"},
    {name = "Shruti Murarka"},
    {name = "Joseph A. Morrone"},
    {name = "Leili Zhang"},
    {name = "Wendy Cornell"},
    {name = "Pablo Meyer"},
    {name = "Jianying Hu"},
    {name = "Parthasarathy Suryanarayanan", email = "psuryan@us.ibm.com"},
]
maintainers = [
    {name = "Bum Chul Kwon", email = "bumchul.kwon@us.ibm.com"},
    {name = "Parthasarathy Suryanarayanan", email = "psuryan@us.ibm.com"},
]
version = "1.0.0"
readme = "README.md"
license = {file = "LICENSE"}
# Python 3.11 matches torch 2.1.0 + CUDA 12.1 compatibility
requires-python = ">=3.11, <3.12"
dependencies = [
    "setuptools>=70,<81",
    "numpy==1.26.4",
    "torch==2.1.0",
    "torchvision==0.16.0",
    "jsonargparse[signatures]==4.27.7",
    "pandas==2.2.2",
    "tqdm==4.66.5",
    "rdkit-pypi==2022.9.5",
    "regex==2024.9.11",
    "biopython==1.84",
    "datasets==2.12.0",
    "pyarrow==12.0.0",
    "transformers==4.45.1",
    "imageio==2.35.1",
    "loralib==0.1.2",
    "mplcursors==0.5.3",
    "xgboost==2.0.3",
    "joblib==1.3.2",
    "x-transformers==1.27.19",
    "lmdb==1.4.1",
    "timm==0.9.16",
    "litdata==0.2.31",
    "torch_geometric==2.3.1",
    "click==8.1.7",
    "huggingface_hub==0.25.1",
    "selfies==2.1.2",
    "pytorch-lightning==2.1.0",
    "tensorboard==2.17.1",
    "omegaconf==2.3.0",
    "scipy==1.11.4",
    "scikit-learn==1.3.2",
    "matplotlib==3.8.4",
    "seaborn==0.13.2",
]

[project.optional-dependencies]
analysis = [
    "altair>=5.5,<6",
    "PyYAML>=6.0.3,<7",
]
guacamol = [
    "guacamol>=0.5.5,<0.6",
    "cma>=4.4,<5",
]
web = [
    "streamlit==1.38.0",
]
clearml = [
    "clearml>=1.18,<2",
]
dev = [
    "jupyterlab==4.2.5",
    "notebook==6.5.5",
    "nvitop==1.3.2",
    "memory-profiler==0.61.0",
    "umap-learn==0.5.6",
    "coverage==7.3.1",
    "pytest==7.3.1",
    "pytest-cov==4.1.0",
    "ruff>=0.13,<0.14",
]

[project.urls]
repository = "https://github.com/BiomedSciAI/STAR-VAE"
preprint = "https://arxiv.org/abs/2511.02769"
issues = "https://github.com/BiomedSciAI/STAR-VAE/issues"

[tool.setuptools]
include-package-data = false

[tool.setuptools.packages.find]
include = ["bmfm_sm_gen*"]
exclude = ["bmfm_sm_gen.scripts*"]
namespaces = false

[tool.setuptools.package-data]
"bmfm_sm_gen.utils" = ["fpscores.pkl.gz"]

[project.scripts]
star-vae-generate = "bmfm_sm_gen.launch.run_generate_molecules:main"
star-vae-generate-bulk = "bmfm_sm_gen.launch.run_generate_molecules:cli_bulk"
star-vae-train = "bmfm_sm_gen.launch.run_train:main"

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
  "UP",   # pyupgrade
  "D",    # pydocstyle
  "PT",   # pytest style checking
  "C4",   # comprehensions style checking
  "PD",   # pandas style checking
  "F",    # pyflakes
  "W605", # pycodestyle: invalid-escape-sequence
  "I",    # isort
]
ignore = [
  "PD901",  # df is a bad variable name
  "PT009",  # Forces use of a regular assert instead of unittest-style
  "D100",   # pydocstyle: Missing module docstring
  "D101",   # pydocstyle: Missing module-level docstring
  "D102",   # pydocstyle: Missing docstring in public module
  "D103",   # pydocstyle: Missing class docstring
  "D105",   # pydocstyle: Missing docstring in magic method
  "D107",   # pydocstyle: Missing parameter descriptions in the docstring
  "D203",   # pydocstyle: 1 blank line required before class docstring
  "D205",   # pydocstyle: 1 blank line required between summary line and description
  "D212",   # pydocstyle: Multi-line docstring summary should start at the first line
  "D401",   # pydocstyle: First line should be in imperative mood
  "D417",   # pydocstyle: Missing argument descriptions in the docstring
  "PD011",  # pandas do not use .values (false positives in torch code)
  "PD015",  # Use .merge method instead of pd.merge function
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["I001"]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "abc.abstractmethod", "@abstract"]

[tool.coverage.run]
branch = true
source = ["bmfm_sm_gen"]
