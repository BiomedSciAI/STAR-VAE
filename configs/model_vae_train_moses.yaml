# ============================================================
# configs/model_vae_train_moses.yaml
# Experiment 1 (MOSES variant): Pre-train STAR-VAE on the MOSES 1.5M dataset.
# Architecture: 4-layer encoder/decoder, d_model=256, latent_dim=128.
#
# Usage:
#   python -m bmfm_sm_gen.launch.run_train fit --config configs/model_vae_train_moses.yaml
#
# The MOSES dataset split (train_selfies.csv, val_selfies.csv) is generated by:
#   python bmfm_sm_gen/data_prep/prep_moses_selfies.py
# ============================================================

model:
  class_path: bmfm_sm_gen.trainers.lm_vae.VAELightningModule
  init_args:
    model_class: bmfm_sm_gen.models.vae.TransformerVAE
    model_params:
      d_model: 256
      nhead: 4
      num_encoder_layers: 4
      num_decoder_layers: 4
      dim_feedforward: 1024
      latent_dim: 128
      dropout: 0.1
      max_len: 74
    tokenizer: ${data.init_args.tokenizer}
    vocab_file: ${data.init_args.vocab_file}
    learning_rate: 0.0002

data:
  class_path: 'bmfm_sm_gen.data.dm_mol.MolecularDataModule'
  init_args:
    train_mode: mem
    data_dir: ""
    train_csv: data/moses_processed/train_selfies.csv
    val_csv: data/moses_processed/val_selfies.csv
    tokenizer: "bmfm_sm_gen.data.base_tokenizer.SELFIESTokenizer"
    vocab_file: ${oc.env:VOCAB_FILE,checkpoints/vae_pubchem80m/vocab.json}
    max_len: 74
    batch_size: 256
    dataset_args:
      modality: 'selfies'
      padding: max_length

trainer:
  max_epochs: 15
  devices: 1
  num_nodes: 1
  accelerator: auto
  default_root_dir: outputs/expt_starvae_moses_pretrain
  logger:
    class_path: 'pytorch_lightning.loggers.TensorBoardLogger'
    init_args:
      save_dir: '${trainer.default_root_dir}'
  log_every_n_steps: 100
  val_check_interval: 1.0
  callbacks:
    - class_path: pytorch_lightning.callbacks.ModelCheckpoint
      init_args:
        dirpath: '${trainer.default_root_dir}/checkpoints'
        filename: 'vae-epoch{epoch:02d}-{step}'
        save_top_k: -1
        save_last: true
        save_on_train_epoch_end: true
